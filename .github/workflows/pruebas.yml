# Gaux Live Timer - batería de pruebas en Mac, Windows y Linux.
# Prueba el timer completo (vistas, tamaños, DAWs, proyectos, descansos, ajustes, analizador,
# Gaux Link) y, en Mac y Windows, abre apps con el nombre de cada DAW para ver que las reconoce.
name: Pruebas

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LEEME.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nombre: Mac
          - os: windows-latest
            nombre: Windows
          - os: ubuntu-latest
            nombre: Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet numpy psutil pytest pytest-timeout
          python -m pip install --quiet sounddevice || true
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y -q xvfb fonts-dejavu; fi
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Pruebas
        shell: bash
        run: |
          # cada archivo en su propio proceso: el timer real tiene una sola ventana Tk, y en Mac
          # abrir y cerrar cientos de Tk en un mismo proceso termina trabando el bucle de eventos
          set +e
          mkdir -p res
          RUN="python -m pytest"
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a -s '-screen 0 1920x1080x24' python -m pytest"; fi
          fail=0
          for f in tests/test_*.py; do
            n=$(basename "$f" .py)
            echo "::group::$n"
            eval $RUN -q -p no:cacheprovider --timeout 240 --timeout-method=thread -rfE \
              --junitxml="res/$n.xml" "$f" 2>&1 | tee -a pruebas.log
            rc=${PIPESTATUS[0]}
            [ "$rc" = 0 ] || [ "$rc" = 5 ] || fail=1
            echo "::endgroup::"
          done
          grep -E "^(FAILED|ERROR) " pruebas.log || true
          exit $fail

      - name: Resumen
        if: always()
        shell: bash
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, os, glob
          t = f = e = k = 0
          for p in glob.glob("res/*.xml"):
              r = ET.parse(p).getroot()
              for s in ([r] if r.tag == "testsuite" else r.findall("testsuite")):
                  t += int(s.get("tests", 0)); f += int(s.get("failures", 0))
                  e += int(s.get("errors", 0)); k += int(s.get("skipped", 0))
          msg = f"{t} pruebas · {t - f - e - k} OK · {f} fallos · {e} errores · {k} omitidas"
          print(msg)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(f"### {os.environ.get('RUNNER_OS')}: {msg}\n")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-${{ matrix.nombre }}
          path: |
            pruebas.log
            res/
